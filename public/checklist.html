<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="color-scheme" content="dark light">
  <meta name="format-detection" content="telephone=no">
  <title>Checklist · House Mates Plano</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0A0A'/%3E%3Cpath d='M7 25V14.5l9-7 9 7V25' fill='none' stroke='%232447F5' stroke-width='3'/%3E%3C/svg%3E">
  <!-- Todo se carga desde public/ para que funcione sin internet, con el celular en el wifi del lugar. -->
  <link rel="stylesheet" href="vendor/fuentes/general-sans.css">
  <link rel="stylesheet" href="checklist.css">
  <script>
    try {
      var p = JSON.parse(localStorage.getItem('housemates-plano:checklist') || '{}');
      if (p.tema === 'claro') document.documentElement.dataset.tema = 'claro';
    } catch (e) {}
  </script>
  <script type="module" src="js/checklist.js"></script>
</head>
<body>
  <header class="encabezado">
    <div class="enc-fila">
      <a class="marca" href="#" id="btn-escenas" aria-label="House Mates Checklist: elegir otro evento">
        <span class="marca-nombre">House Mates</span>
        <span class="marca-sub">Checklist</span>
      </a>
      <div class="enc-acciones">
        <button type="button" class="boton-quien" id="btn-quien" hidden></button>
        <button type="button" class="boton-icono" id="btn-tema" aria-label="Cambiar a modo sol (más contraste al aire libre)"></button>
      </div>
    </div>
    <div id="resumen"></div>
    <div class="agrupar" id="agrupar" role="radiogroup" aria-label="Agrupar la lista" hidden></div>
  </header>

  <div class="barra-fija" id="barra-fija" hidden>
    <div class="chips" id="chips" role="radiogroup" aria-label="Mostrar"></div>
    <div class="barra-mini" aria-hidden="true"><i class="seg-armado"></i><i class="seg-llego"></i><i class="seg-problema"></i></div>
  </div>

  <main id="contenido" class="contenido">
    <p class="cargando">Cargando…</p>
  </main>

  <div class="sin-conexion" id="sin-conexion" role="status" hidden>
    <span id="sin-conexion-texto">Sin conexión con la compu.</span>
    <button type="button" id="btn-reintentar">Reintentar</button>
  </div>

  <div class="aviso" id="aviso" role="status" aria-live="polite" hidden></div>

  <dialog class="hoja" id="hoja" aria-labelledby="hoja-titulo"></dialog>

  <dialog class="dialogo" id="dlg-quien" aria-labelledby="quien-titulo">
    <form method="dialog" id="form-quien">
      <h2 id="quien-titulo">¿Quién sos?</h2>
      <p>Tu nombre aparece al lado de lo que marcás, así el equipo sabe quién lo vio.</p>
      <input id="campo-quien" name="quien" maxlength="40" autocomplete="name" autocapitalize="words" enterkeyhint="done" placeholder="Tu nombre" required>
      <div class="dialogo-botones">
        <button type="submit" class="primario" value="ok">Listo</button>
      </div>
    </form>
  </dialog>

  <input type="file" id="entrada-foto" accept="image/*" capture="environment" hidden>

  <noscript><p class="cargando">Esta página necesita JavaScript.</p></noscript>
</body>
</html>
